name: AbsensiDigital Auto QA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: lts/*
        cache: 'npm'

    - name: Install dependencies (Frontend)
      working-directory: ./AbsensiDigital
      run: npm install

    - name: Install dependencies (QA)
      working-directory: ./AbsensiDigital/qa
      run: npm install

    - name: Install Playwright Browsers
      working-directory: ./AbsensiDigital/qa
      run: npx playwright install --with-deps

    - name: Start Next.js App
      working-directory: ./AbsensiDigital
      run: npm run dev &
      
    - name: Wait for server
      run: |
        npm install -g wait-on
        wait-on http://127.0.0.1:3000 --timeout 60000

    - name: Run Playwright tests
      working-directory: ./AbsensiDigital/qa
      run: npx playwright test
      env:
        FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
        FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
        FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
        FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
        FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
        FIREBASE_USER: ${{ secrets.FIREBASE_USER }}
        FIREBASE_PASS: ${{ secrets.FIREBASE_PASS }}

    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: AbsensiDigital-qa/playwright-report/
        retention-days: 30
